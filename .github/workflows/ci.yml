#
# Apex CI: the typecheck, unit tests and smoke test on every push and pull
# request, on macOS, Windows and Linux.
#
# The smoke test (`npm run smoke`) builds the app and launches it headed with
# APEX_SMOKE=1. macOS and Windows runners have a desktop session; on Linux it
# runs under xvfb. In smoke mode, chats use the offline Messages client
# (src/main/smokeClient.ts), so the jobs need no secrets and make no API calls.
# The one exception is the optional signed-mac job at the end, which runs only
# when the signing secrets are set and is skipped otherwise.
name: CI

on:
  push:
    # Branches only. Version tags belong to the release workflow.
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test and smoke (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Electron 45 downloads its binary on first use. Fetching it here means a
      # download failure shows up as its own step, not as a failed smoke test.
      - name: Fetch the Electron binary
        run: node node_modules/electron/install.js

      - name: Typecheck
        run: npm run typecheck

      # The committed icon sets (branding/official and branding/unofficial) match what scripts/app-icons draws.
      - name: Icons are current
        run: |
          node scripts/app-icons/generate.mjs --check
          node scripts/app-icons/unofficial.mjs --check

      - name: Unit tests
        run: |
          unset ELECTRON_RUN_AS_NODE
          npm test

      - name: Smoke test
        run: |
          unset ELECTRON_RUN_AS_NODE
          npm run smoke

  # The runner works as an administrator, so the confinement tests make real
  # symlinks (a desktop without Developer Mode falls back to junctions).
  # .gitattributes keeps the checkout LF, so the byte-for-byte checks hold.
  windows:
    name: Typecheck, test and smoke (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Fetch the Electron binary
        run: node node_modules/electron/install.js

      - name: Typecheck
        run: npm run typecheck

      - name: Icons are current
        run: |
          node scripts/app-icons/generate.mjs --check
          node scripts/app-icons/unofficial.mjs --check

      - name: Unit tests
        run: npm test

      - name: Smoke test
        run: npm run smoke

  linux:
    name: Typecheck, test and smoke (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      # xvfb is the display and openbox its window manager, as every Linux
      # desktop has one (without it windows aren't managed: no focus rules,
      # no frames). Ubuntu 24.04's AppArmor blocks the unprivileged user
      # namespaces Chromium's sandbox needs, so allow them for the run.
      - name: Prepare a display and the sandbox
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb openbox
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Fetch the Electron binary
        run: node node_modules/electron/install.js

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: |
          unset ELECTRON_RUN_AS_NODE
          npm test

      # The same steps as `npm run smoke`, with the kit (pack apps' import map and Apex UI), under the display.
      - name: Smoke test
        run: |
          unset ELECTRON_RUN_AS_NODE
          npx electron-vite build
          node scripts/kit/build.mjs
          xvfb-run -a sh -c 'openbox & sleep 1; exec node scripts/smoke.mjs'

  # Optional: a Developer ID build of the macOS app, signed (and notarized when
  # the notarization secrets are there), checked and thrown away. It needs the
  # signing secrets, so forks and pull requests from them skip it. With
  # MAC_PROVISIONING_PROFILE it builds the browser passkeys mode
  # (docs/release.md, "Browser passkeys and iCloud Passwords"). The secrets
  # reach only the steps that sign, never `npm ci`'s install scripts.
  signed-mac:
    name: Signed macOS build (optional)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      # A job's `if` can't read secrets, so this step decides for the rest.
      - name: Check for the signing secrets
        id: secrets
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
        run: |
          if [ -n "$MAC_CSC_LINK" ]; then
            echo "sign=true" >> "$GITHUB_OUTPUT"
          else
            echo "sign=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No MAC_CSC_LINK secret, so the signed macOS build is skipped."
          fi

      - name: Check out
        if: steps.secrets.outputs.sign == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 22
        if: steps.secrets.outputs.sign == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        if: steps.secrets.outputs.sign == 'true'
        run: npm ci --no-audit --no-fund

      - name: Fetch the Electron binary
        if: steps.secrets.outputs.sign == 'true'
        run: node node_modules/electron/install.js

      - name: Write the provisioning profile and the notarization key
        if: steps.secrets.outputs.sign == 'true'
        env:
          MAC_PROVISIONING_PROFILE: ${{ secrets.MAC_PROVISIONING_PROFILE }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "$MAC_PROVISIONING_PROFILE" ]; then
            profile="$RUNNER_TEMP/apex.provisionprofile"
            printf '%s' "$MAC_PROVISIONING_PROFILE" | base64 --decode > "$profile"
            echo "APEX_PROVISIONING_PROFILE=$profile" >> "$GITHUB_ENV"
          fi
          if [ -n "$APPLE_API_KEY_P8" ]; then
            key="$RUNNER_TEMP/AuthKey.p8"
            printf '%s' "$APPLE_API_KEY_P8" > "$key"
            chmod 600 "$key"
            echo "APPLE_API_KEY=$key" >> "$GITHUB_ENV"
          fi

      # The mode, the identity and the profile check, before anything is built.
      - name: Signing preflight
        if: steps.secrets.outputs.sign == 'true'
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APEX_TEAM_ID: ${{ vars.APEX_TEAM_ID }}
          APEX_BUNDLE_ID: ${{ vars.APEX_BUNDLE_ID }}
        run: node scripts/release/preflight.mjs

      - name: Package, sign and notarize
        if: steps.secrets.outputs.sign == 'true'
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APEX_TEAM_ID: ${{ vars.APEX_TEAM_ID }}
          APEX_BUNDLE_ID: ${{ vars.APEX_BUNDLE_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          unset ELECTRON_RUN_AS_NODE
          npm run package:mac

      - name: Verify the signed app
        if: steps.secrets.outputs.sign == 'true'
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          APEX_TEAM_ID: ${{ vars.APEX_TEAM_ID }}
          APEX_BUNDLE_ID: ${{ vars.APEX_BUNDLE_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          unset ELECTRON_RUN_AS_NODE
          app=dist/mac-arm64/Apex.app
          codesign -d --entitlements - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          node scripts/release/verify.mjs --no-smoke
