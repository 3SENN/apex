name: Feature request
description: An idea for Apex.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The problem or the moment where Apex falls short, in your own words.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could Apex help?
      description: Your idea for a solution. Sketches and examples are welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
