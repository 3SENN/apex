<html lang="en">

    <meta charset="UTF-8" />
    <!-- Atelier's hidden preprocessing renderer: offscreen, sandboxed, no
         preload, in the locked-down in-memory partition atelier-preprocess. It
         only re-encodes the bytes main hands it; it never fetches anything. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; img-src blob: data:; worker-src 'self'" />
    <title>%BRAND_NAME% preprocess</title>
  </head>
  <body>
    <script type="module" src="/preprocess/main.ts"></script>
  </body>
</html>
